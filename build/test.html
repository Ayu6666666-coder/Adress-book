<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通讯录数据测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>通讯录数据加载测试</h1>
    <div id="status" class="status info">正在测试数据加载...</div>
    <div id="result"></div>

    <script>
        async function testDataLoad() {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            
            try {
                statusDiv.textContent = '正在获取数据...';
                
                const response = await fetch('./contacts.json');
                console.log('响应状态:', response.status, response.statusText);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('数据加载成功:', data);
                
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ 数据加载成功！';
                
                resultDiv.innerHTML = `
                    <h3>数据统计：</h3>
                    <ul>
                        <li>总联系人数：${data.total || data.contacts?.length || 0}</li>
                        <li>部门数量：${data.departments?.length || 0}</li>
                        <li>数据字段：${data.fields?.join(', ') || '未知'}</li>
                    </ul>
                    <h3>部门列表：</h3>
                    <ul>
                        ${(data.departments || []).map(dept => `<li>${dept}</li>`).join('')}
                    </ul>
                    <h3>前5个联系人：</h3>
                    <ul>
                        ${(data.contacts || []).slice(0, 5).map(contact => 
                            `<li>${contact.姓名} - ${contact.部门} - ${contact.手机 || '无手机'}</li>`
                        ).join('')}
                    </ul>
                `;
                
            } catch (error) {
                console.error('数据加载失败:', error);
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ 数据加载失败: ${error.message}`;
                
                resultDiv.innerHTML = `
                    <h3>错误详情：</h3>
                    <p>${error.message}</p>
                    <h3>可能的解决方案：</h3>
                    <ul>
                        <li>检查 contacts.json 文件是否存在于 public 目录</li>
                        <li>检查文件格式是否正确</li>
                        <li>检查网络连接</li>
                        <li>查看浏览器控制台获取更多信息</li>
                    </ul>
                `;
            }
        }
        
        // 页面加载完成后执行测试
        window.addEventListener('load', testDataLoad);
    </script>
</body>
</html>
